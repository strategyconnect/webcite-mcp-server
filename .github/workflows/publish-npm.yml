name: Publish to npm (Trusted Publishing)

# Configure Trusted Publisher on npmjs.com for this repo + this workflow file.
# No NPM_TOKEN required when OIDC trusted publishing is enabled.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
        # Do not set NODE_AUTH_TOKEN when using trusted publishing.
